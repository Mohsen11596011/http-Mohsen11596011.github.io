
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USDT Thetr Web Wallet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .wallet {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 340px;
    }
    .logo {
      width: 64px;
      margin-bottom: 1rem;
    }
    .balance {
      font-size: 1.5rem;
      margin: 1rem 0;
    }
    input {
      width: 90%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      padding: 0.5rem 1rem;
      margin-top: 0.5rem;
      border: none;
      background-color: #3773f5;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wallet">
    <img class="logo" src="https://cryptologos.cc/logos/tether-usdt-logo.png" alt="USDT Thetr">
    <h2>USDT Thetr Wallet</h2>
    <p><strong>Your Address:</strong><br> 0x5f0789Ddf32c33E7DF14e5a3321a60d071dCEE86</p>
    <div class="balance" id="balance">Loading...</div>

    <input type="text" id="toAddress" placeholder="Recipient Address">
    <input type="number" id="amount" placeholder="Amount to Send">
    <button onclick="sendToken()">Send</button>
  </div>

  <script>
    const walletAddress = "0x5f0789Ddf32c33E7DF14e5a3321a60d071dCEE86";
    const dataURL = 'https://api.jsonbin.io/v3/b/661339ef9d90c079a908579b';
    const headers = { 'X-Master-Key': '/* your JSONBin key here if private */' };

    let balances = {};

    async function loadBalance() {
      try {
        const res = await fetch(dataURL + '/latest', { headers });
        const data = await res.json();
        balances = data.record;
        document.getElementById('balance').textContent = `${balances[walletAddress] || 0} USDT`;
      } catch (err) {
        document.getElementById('balance').textContent = 'Error loading balance';
      }
    }

    async function sendToken() {
      const to = document.getElementById('toAddress').value;
      const amount = parseFloat(document.getElementById('amount').value);
      if (!to || !amount || amount <= 0) {
        alert('Enter valid address and amount');
        return;
      }
      if ((balances[walletAddress] || 0) < amount) {
        alert('Insufficient funds');
        return;
      }
      balances[walletAddress] -= amount;
      balances[to] = (balances[to] || 0) + amount;
      document.getElementById('balance').textContent = `${balances[walletAddress]} USDT`;

      await fetch(dataURL, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          ...headers
        },
        body: JSON.stringify(balances)
      });

      alert(`Sent ${amount} USDT Thetr to ${to}`);
    }

    loadBalance();
  </script>
</body>
</html>
